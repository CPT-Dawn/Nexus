# WPA2-Enterprise with hostapd's built-in EAP server (PEAP/MSCHAPv2, TTLS/PAP, TLS).
# @PKI@ is the throwaway CA and server certificate inner.sh generates.
interface=@IFACE@
driver=nl80211
hw_mode=g
channel=1
country_code=US
ssid=NexusEap
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP
ieee8021x=1
eap_server=1
eap_user_file=@PKI@/eap.users
ca_cert=@PKI@/ca.pem
server_cert=@PKI@/server.pem
private_key=@PKI@/server.key
