[package]
name = "nexus"
description = "A network manager for Wayland desktops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
listenfd = "1"
nexus-ipc.workspace = true
futures-util = { version = "0.3", default-features = false }
rustix = { version = "1", features = ["process", "time"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "signal", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
nexus-testkit = { path = "../nexus-testkit" }
serde_json = "1"

[lints]
workspace = true
