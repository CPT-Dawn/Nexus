[package]
name = "nexus"
description = "A network manager for Wayland desktops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "nexus_tui"
path = "src/lib.rs"

[dependencies]
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
listenfd = "1"
nexus-ipc.workspace = true
futures-util = { version = "0.3", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["event", "fs", "process", "pty", "rand", "termios", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "signal", "sync", "macros", "time", "process"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
zeroize = "1.9.1"
qrcode = { version = "0.14", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
base64 = "0.23.1"
oo7 = { version = "0.7.0", default-features = false, features = ["tokio", "native_crypto"] }

[dev-dependencies]
insta = "1"
nexus-testkit = { path = "../nexus-testkit" }
proptest = "1.12.0"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
