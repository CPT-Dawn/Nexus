name: Feature request
description: Something Nexus could do for you
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you picture Nexus solving it. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you use now
      description: Other tools or workarounds you've tried.
